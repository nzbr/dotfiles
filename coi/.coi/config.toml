[container]
image = "coi-custom"

[container.build]
base = "ubuntu:24.04"
script = "build.sh"
compression = "none"

[paths]
preserve_workspace_path = true

[defaults]
profile = "gui"

[defaults.environment]
BASH_ENV = "/etc/coi/set-environment.sh"
# Use the auth-bridge as the default browser
BROWSER = "/home/code/.dotfiles/coi/.coi/login-open"
# Keep Codex's runtime state separate from the image's ~/.codex/packages install.
CODEX_HOME = "/home/code/.codex-state"

[defaults.env_commands]
# GH_TOKEN = "gh auth token"

[ssh]
# forward_agent = true

[[credentials]]
host = "~/.config/graphite"
container = "/home/code/.config/graphite"
chmod = "0600"

# NIX

[[mounts.default]]
host = "/nix/store"
container = "/nix/store"
readonly = true

[[sockets]]
host = "/nix/var/nix/daemon-socket/socket"
container = "/nix/var/nix/daemon-socket/socket"

# CLAUDE

[[mounts.default]]
host = "~/.claude/projects"
container = "/home/code/.claude-shared/projects"

[[mounts.default]]
host = "~/.claude/skills"
container = "/home/code/.claude-shared/skills"
readonly = true

[[mounts.default]]
host = "~/.claude/output-styles"
container = "/home/code/.claude-shared/output-styles"
readonly = true

# CODEX

[[mounts.default]]
host = "~/.codex"
container = "/home/code/.codex-state"

# DESKTOP INTEROP

[[sockets]]
host = "/run/user/1000/agent-notify.sock"
container = "/run/user/1000/agent-notify-relay.sock"

[[sockets]]
host = "/run/user/1000/agent-login.sock"
container = "/run/user/1000/agent-login-relay.sock"
