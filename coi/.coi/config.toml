[container]
image = "coi-custom"

[container.build]
base = "ubuntu:24.04"
script = "build.sh"
compression = "none"

[defaults]
profile = "gui"

[paths]
preserve_workspace_path = true

[defaults.environment]
BASH_ENV = "/etc/coi/set-environment.sh"
# Use the auth-bridge as the default browser
BROWSER = "/home/code/.dotfiles/coi/.coi/login-open"
# Keep Codex's runtime state separate from the image's ~/.codex/packages install.
CODEX_HOME = "/home/code/.codex-state"
# Use the host's claude config, see the mount below
CLAUDE_CONFIG_DIR = "/home/nzbr/.claude"

[defaults.env_commands]
# GH_TOKEN = "gh auth token"

[ssh]
# forward_agent = true

[[credentials]]
host = "~/.config/graphite"
container = "/home/code/.config/graphite"
chmod = "0600"

[tool]
permission_mode = "interactive"
# See "Sandbox context" in build.sh
auto_context = false

# NIX

[[mounts.default]]
host = "/nix/store"
container = "/nix/store"
readonly = true

[[sockets]]
host = "/nix/var/nix/daemon-socket/socket"
container = "/nix/var/nix/daemon-socket/socket"

# CLAUDE

# The host's whole ~/.claude, read-write, so that settings, plugins, history and
# the login are the same everywhere. A refresh token rotates on every refresh, so
# a copy of the login per container would sign out all the others.
#
# It goes to the host's path rather than ~/.claude in here, because claude keeps
# absolute paths in it (installed_plugins.json, for one). The host's
# ~/.claude.json is a symlink into this directory, which is where claude looks
# for it when CLAUDE_CONFIG_DIR is set -- see claude-config.nix in the
# home-manager repo.
[[mounts.default]]
host = "~/.claude"
container = "/home/nzbr/.claude"

# CODEX

[[mounts.default]]
host = "~/.codex"
container = "/home/code/.codex-state"

# DESKTOP INTEROP

[[sockets]]
host = "/run/user/1000/agent-notify.sock"
container = "/run/user/1000/agent-notify-relay.sock"

[[sockets]]
host = "/run/user/1000/agent-login.sock"
container = "/run/user/1000/agent-login-relay.sock"
